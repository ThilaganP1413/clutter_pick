# All lengths in metres, angles in degrees. Table top surface is at world z = 0.
physics:
  timestep: 0.002

table:
  size: [1.00, 1.00, 0.05]      # full extents x, y, thickness

bin:
  inner_size: [0.40, 0.30]      # inner floor extents x, y
  wall_height: 0.15             # outer height above table top
  wall_thickness: 0.01
  floor_thickness: 0.01

camera:
  name: top_cam
  height: 0.75                  # optical centre above table top
  fovy: 45.0                    # vertical field of view
  width: 256
  height_px: 256

debug_camera:
  name: debug_cam
  pos: [0.75, -0.75, 0.70]

render:
  gl_backend: egl               # used only if MUJOCO_GL is not already set; null = leave alone

can:
  mesh: assets/objects/soda_can.stl    # origin at base centre, axis +z
  nominal_dims: [0.066, 0.066, 0.128]  # diameter-matched, scale 0.004272
  mass: 0.150                          # kg
  init_xy: [0.0, 0.0]                  # upright on the bin floor
  rgba: [0.75, 0.10, 0.10, 1.0]
  condim: 6                          # torsional + rolling friction
  friction: [1.0, 0.005, 0.0001]     # slide, torsion, rolling [m]

reset:
  drop_z: 0.15                       # COM height at release [m]
  xy_range: [0.128, 0.078]           # COM x, y in +-range; bounding sphere stays inside walls
  p_upright: 0.25                    # probability of starting upright
  settle:
    window_s: 0.25                   # compare poses every window
    max_disp: 0.0004                 # m per window  (~5 mm / 3 s)
    max_rot: 0.012                   # rad per window (0.4 mm at the 33 mm radius)
    calm_windows: 2                  # consecutive calm windows required
    timeout_s: 10.0
  verify_s: 3.0                      # post-settle simulation time for the drift check
  verify_drift: 0.005                # m, max drift over verify_s for the determinism check
  max_attempts: 5

suction:
  cup_radius: 0.010     # m; normal-fit ball radius AND (M5) ray-ring radius. ~1 kg vertical at 60 kPa
  n_ring: 6               # CODs: 1 centre + 6 border rays
  standoff: 0.02          # m; ray origins start this far above the point along the approach
  max_spread: 0.002       # m; bellows stroke budget (max-min hit distance). Barrel ~1.5, shoulder rejected
  max_tilt_deg: 60        # CODs: clip the approach to <= 60 deg from vertical
  min_normal_pts: 6

rl:
  reward_success: 1.0     # one-step task: critic then estimates P(success)
  reward_fail: 0.0